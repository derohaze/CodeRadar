<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeRadar</title>
    <meta name="description" content="CodeRadar desktop interface for reviewing security scans and fixing issues early." />

    <!--
      Set the resolved theme before the first paint so there is no dark/light
      flash on startup. Uses the user's saved choice when available, otherwise
      falls back to the operating system preference. The app shell keeps this
      in sync with the runtime setting once settings finish loading.
    -->
    <script>
      (function () {
        try {
          var saved = null;
          try {
            saved = window.localStorage.getItem("coderadar.theme");
          } catch (e) {
            saved = null;
          }
          var prefersLight = false;
          try {
            prefersLight = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches;
          } catch (e) {
            prefersLight = false;
          }
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : prefersLight
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="author" content="CodeRadar" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <meta property="og:title" content="CodeRadar" />
    <meta property="og:description" content="CodeRadar desktop interface for reviewing security scans and fixing issues early." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeRadar" />
    <meta name="twitter:description" content="CodeRadar desktop interface for reviewing security scans and fixing issues early." />
    <meta name="twitter:image" content="/icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
